name: Build Block Burst 2 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -iname 'BlockBurst-Android-Source.zip' -print -quit)
          test -n "$ZIP" || { echo 'Project ZIP not found'; exit 1; }
          unzip -o "$ZIP" -d extracted
      - name: Build APK
        working-directory: extracted/BlockBurst
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBurst2-APK
          path: extracted/BlockBurst/app/build/outputs/apk/debug/*.apk
